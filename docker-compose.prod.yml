services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./api-backend/src/infrastructure/db/migrations/script.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - olo-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - olo-network

  api-backend:
    build:
      context: .
      dockerfile: api-backend/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: https://${SITIO_WEB_DOMAIN}
      INTRANET_URL: https://${INTRANET_DOMAIN}
      NODE_ENV: production
      LOCAL_AUTH_EMAIL: ${LOCAL_AUTH_EMAIL}
      LOCAL_AUTH_PASSWORD: ${LOCAL_AUTH_PASSWORD}
      LOCAL_AUTH_NAME: ${LOCAL_AUTH_NAME:-Superadmin}
      LOCAL_AUTH_ROLE: ${LOCAL_AUTH_ROLE:-Superadmin}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - olo-network

  sitio-web:
    build:
      context: .
      dockerfile: sitio-web/Dockerfile
      args:
        BACKEND_URL: http://api-backend:4000
        NEXT_PUBLIC_API_URL: https://${SITIO_WEB_DOMAIN}
        JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api-backend:4000
      NEXT_PUBLIC_API_URL: https://${SITIO_WEB_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - api-backend
    networks:
      - olo-network

  intranet:
    build:
      context: .
      dockerfile: intranet/Dockerfile
      args:
        API_BACKEND_URL: http://api-backend:4000
    restart: unless-stopped
    environment:
      API_BACKEND_URL: http://api-backend:4000
      NEXT_PUBLIC_API_URL: https://${INTRANET_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SITIO_WEB_URL: https://${SITIO_WEB_DOMAIN}
    depends_on:
      - api-backend
    networks:
      - olo-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - sitio-web
      - intranet
    networks:
      - olo-network

volumes:
  pg_data:
  redis_data:
  nginx_logs:

networks:
  olo-network:
    driver: bridge
