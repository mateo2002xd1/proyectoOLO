events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Configuraciones de rendimiento
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # ── Límites de tasa ─────────────────────────────────────────────────────
    #
    # Barrera volumétrica delante de Node. No sustituye a los límites de la API
    # —esos cuentan por usuario o por correo, que es lo que de verdad hay que
    # proteger— sino que evita que el proceso llegue siquiera a ver una inundación.
    #
    # Aquí $binary_remote_addr SÍ es la IP del visitante: nginx es el primer salto,
    # así que no hay cabecera que falsificar. Por eso este control vive aquí y no
    # solo en Express.
    #
    # 20 r/s con ráfaga de 40 es holgado para navegar —una pantalla del panel dispara
    # varias peticiones a la vez— y estrecho para un bucle automatizado.
    limit_req_zone  $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conexiones:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # ── PENDIENTE: /api/ eclipsa los route handlers de Next ─────────────────
    #
    # Los dos bloques de abajo mandan TODO /api/ al backend de Express, pero
    # sitio-web tiene rutas propias bajo ese mismo prefijo (/api/auth/login,
    # /api/upload, /api/users...) que Express no conoce: con esta configuración
    # responden 404 en producción.
    #
    # Hay que decidir el prefijo antes de desplegar — por ejemplo exponer la API
    # como /api-backend/ y dejar /api/ a Next, que es lo que ya hace la intranet.
    #
    # Nota relacionada: la política de subida admite documentos de hasta 50 MB y
    # client_max_body_size está en 10M, así que nginx los cortaría antes.
    # Upstreams
    upstream sitio_web {
        server sitio-web:3000;
    }

    upstream intranet {
        server intranet:3001;
    }

    upstream api_backend {
        server api-backend:4000;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Sitio Web (HTTPS)
    server {
        listen 443 ssl http2;
        server_name ${SITIO_WEB_DOMAIN};

        # SSL (Let's Encrypt)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API proxy
        location /api/ {
            limit_req  zone=api_general burst=40 nodelay;
            limit_conn conexiones 20;

            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Sitio Web
        location / {
            proxy_pass http://sitio_web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }

    # Intranet (HTTPS)
    server {
        listen 443 ssl http2;
        server_name ${INTRANET_DOMAIN};

        # SSL (Let's Encrypt)
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # SSL Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API proxy
        location /api/ {
            limit_req  zone=api_general burst=40 nodelay;
            limit_conn conexiones 20;

            proxy_pass http://api_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Intranet
        location / {
            proxy_pass http://intranet;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
