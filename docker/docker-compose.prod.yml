# Nombre fijo de proyecto: sin esto Compose lo arma solo desde el nombre de la carpeta
# (cambia segun donde se clone el repo), y con el tambien cambia el prefijo por defecto
# de las redes y los volumenes con nombre.
name: olo-app

services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Sin script de inicializacion: ese `script.sql` se movio a `migrations/_obsoletas/`
      # y Docker no falla por un origen que no existe, crea un directorio vacio en su
      # lugar. El esquema lo aplican las migraciones -- ver el servicio `migraciones`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - olo-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - olo-network

  api-backend:
    build:
      context: .
      dockerfile: api-backend/Dockerfile
    container_name: api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 4000
      # Dentro de un contenedor, 127.0.0.1 -el valor por defecto- significa "solo yo":
      # nginx, el sitio y la intranet son contenedores distintos y no la alcanzarian.
      # Aqui es seguro porque este servicio no publica el puerto 4000: solo nginx
      # publica puertos, y solo el 80 y el 443.
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      FRONTEND_URL: https://${SITIO_WEB_DOMAIN}
      INTRANET_URL: https://${INTRANET_DOMAIN}
      # Interna, por la red de Docker: revalidar al publicar es servidor a servidor y no
      # tiene por que salir a internet ni pasar por nginx. FRONTEND_URL sigue siendo la
      # publica porque es el origen CORS del navegador.
      SITIO_WEB_URL: http://sitio-web:3000
      REVALIDAR_SECRET: ${REVALIDAR_SECRET}
      NODE_ENV: production
      # Sin LOCAL_AUTH_*: la cuenta maestra local es solo de desarrollo, y la API la
      # desactiva sola con NODE_ENV=production (api-backend/src/config/index.ts).
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - olo-network

  # Aplica las migraciones de esquema. No arranca con `up` -tiene perfil-: se invoca
  # con `./docker/deploy.sh migrar`, que hace `docker compose run --rm migraciones`.
  #
  # Hace falta un paso propio porque el esquema lo definen las migraciones, nunca el
  # arranque: `server.ts` comprueba que no haya pendientes y aborta si las hay. Sobre
  # una base recien creada son 19, asi que sin esto la API entra en bucle de reinicio.
  #
  # Usa la etapa `builder` y no la imagen final: `npm run migrate` es
  # `ts-node scripts/migrate.ts up`, y la final se construye con `npm ci --omit=dev`
  # (sin ts-node) y solo lleva `dist/` (sin `scripts/`). El builder tiene las dos cosas.
  migraciones:
    build:
      context: .
      dockerfile: api-backend/Dockerfile
      target: builder
    profiles: ["tools"]
    command: ["npm", "run", "migrate"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      # `scripts/migrate.ts` carga `src/config/database`, que a su vez importa la
      # configuracion general, y esa aborta el proceso si falta JWT_SECRET.
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - olo-network

  sitio-web:
    build:
      context: .
      dockerfile: sitio-web/Dockerfile
      args:
        BACKEND_URL: http://api-backend:4000
        # Con /api-backend: es la baseURL que usa el NAVEGADOR, y nginx reserva /api/
        # para las rutas propias de Next del sitio (el login entre ellas).
        #
        # Va como ARG y no solo como variable de entorno porque Next incrusta las
        # NEXT_PUBLIC_* en el bundle del navegador al compilar: definirla despues no
        # cambia nada de lo que ya se compilo.
        NEXT_PUBLIC_API_URL: https://${SITIO_WEB_DOMAIN}/api-backend
        # El botón de Intranet del header lo resuelve el NAVEGADOR: sin esto, el
        # fallback embebido en el bundle se queda en localhost:3001 y el botón no
        # lleva a ningún lado en producción.
        NEXT_PUBLIC_INTRANET_URL: https://${INTRANET_DOMAIN}
    container_name: sitio-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Server-side, por la red interna: aqui no pasa por nginx y no lleva prefijo.
      BACKEND_URL: http://api-backend:4000
      NEXT_PUBLIC_API_URL: https://${SITIO_WEB_DOMAIN}/api-backend
      NEXT_PUBLIC_INTRANET_URL: https://${INTRANET_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      # El mismo valor que en api-backend: es lo que autentica POST /api/revalidar.
      REVALIDAR_SECRET: ${REVALIDAR_SECRET}
    depends_on:
      - api-backend
    networks:
      - olo-network

  intranet:
    build:
      context: .
      dockerfile: intranet/Dockerfile
      args:
        API_BACKEND_URL: http://api-backend:4000
        # La resuelve el NAVEGADOR (enlaces de la intranet al portal público). Va como
        # ARG porque Next la incrusta en el bundle al compilar: como solo variable de
        # entorno llegaba tarde, y los enlaces salían al `localhost` de cada visitante.
        NEXT_PUBLIC_SITIO_WEB_URL: https://${SITIO_WEB_DOMAIN}
    container_name: intranet
    restart: unless-stopped
    env_file:
      - .env
    environment:
      API_BACKEND_URL: http://api-backend:4000
      NEXT_PUBLIC_API_URL: https://${INTRANET_DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SITIO_WEB_URL: https://${SITIO_WEB_DOMAIN}
    depends_on:
      - api-backend
    networks:
      - olo-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Los dos dominios que la plantilla necesita sustituir. Sin esto,
      # `server_name ${SITIO_WEB_DOMAIN};` llegaba literal a la configuracion final y
      # ese bloque no casaba con ningun dominio: todo caia en el server por defecto.
      SITIO_WEB_DOMAIN: ${SITIO_WEB_DOMAIN}
      INTRANET_DOMAIN: ${INTRANET_DOMAIN}
      # La plantilla es el nginx.conf entero (con events{} y http{}), no un fragmento
      # de conf.d, asi que el resultado tiene que caer en /etc/nginx/nginx.conf.
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      # Solo se sustituyen esas dos variables. Sin el filtro, envsubst tocaria
      # cualquier $VAR presente en el entorno del contenedor, y la configuracion esta
      # llena de variables propias de nginx ($host, $remote_addr, $binary_remote_addr)
      # que deben llegar intactas. El $$ es como compose escribe un $ literal.
      NGINX_ENVSUBST_FILTER: "^(SITIO_WEB_DOMAIN|INTRANET_DOMAIN)$$"
    volumes:
      - ./docker/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      # Los certificados los escribe certbot en su volumen; nginx solo los lee.
      # Antes se montaba ./nginx/ssl, un directorio que no existe en el repo y que
      # nadie llenaba: nginx no llegaba a arrancar por no encontrar el certificado.
      - certbot_conf:/etc/letsencrypt:ro
      # El reto de Let's Encrypt: certbot deja el archivo aqui y nginx lo sirve desde
      # `location /.well-known/acme-challenge/`. Faltaba el volumen, asi que el reto
      # nunca se habria podido responder.
      - certbot_www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - sitio-web
      - intranet
    networks:
      - olo-network

  # Emite y renueva los certificados. No arranca con `up` -tiene perfil-: es una
  # herramienta de un solo uso que invocan `./docker/init-ssl.sh` y `./docker/deploy.sh renovar`
  # con `docker compose run --rm certbot ...`, y `run` activa el perfil solo.
  #
  # Sin `command` ni `entrypoint` a proposito: el entrypoint por defecto de la imagen
  # ya es `certbot`, que es lo que permite pasarle `certonly` o `renew` como
  # argumentos. init-ssl.sh lo sobreescribe con `--entrypoint sh` cuando necesita
  # openssl para el certificado provisional.
  certbot:
    image: certbot/certbot:latest
    profiles: ["ssl"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks:
      - olo-network

volumes:
  pg_data:
  redis_data:
  nginx_logs:
  certbot_conf:
  certbot_www:

networks:
  olo-network:
    driver: bridge
