# Los secretos salen del archivo .env de la raíz (ver .env.example), nunca en claro
# aquí: este archivo SÍ se versiona, y hasta 2026-08-20 llevaba dentro el JWT_SECRET
# real y la contraseña de la cuenta maestra.

# Nombre fijo de proyecto: sin esto Compose lo arma solo desde el nombre de la carpeta
# (cambia segun donde se clone el repo), y con el tambien cambia el prefijo por defecto
# de las redes y los volumenes con nombre.
name: olo-app

services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Sin script de inicializacion: ese `script.sql` se movio a `migrations/_obsoletas/`
      # y Docker no falla por un origen que no existe, crea un directorio vacio en su
      # lugar. El esquema lo aplican las migraciones -- ver el servicio `migraciones`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-backend:
    build:
      context: .
      dockerfile: api-backend/Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: 4000
      # Dentro de un contenedor, 127.0.0.1 -el valor por defecto- significa "solo yo":
      # nginx, el sitio y la intranet son contenedores distintos y no la alcanzarian.
      # Aqui es seguro porque este servicio no publica el puerto 4000: solo nginx
      # publica puertos, y solo el 80 y el 443.
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost:3000
      INTRANET_URL: http://localhost:3001
      # Con la que la API llama al sitio desde dentro de la red de Docker, para pedirle
      # que revalide una pagina al aprobarla. No sirve FRONTEND_URL: esa es la URL del
      # navegador (origen CORS), y aqui "localhost" seria el contenedor de la propia API.
      SITIO_WEB_URL: http://sitio-web:3000
      REVALIDAR_SECRET: ${REVALIDAR_SECRET}
      NODE_ENV: development
      LOCAL_AUTH_EMAIL: ${LOCAL_AUTH_EMAIL}
      LOCAL_AUTH_PASSWORD: ${LOCAL_AUTH_PASSWORD}
      LOCAL_AUTH_NAME: ${LOCAL_AUTH_NAME:-Superadmin}
      LOCAL_AUTH_ROLE: ${LOCAL_AUTH_ROLE:-Superadmin}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Aplica las migraciones de esquema. No arranca con `up` -tiene perfil-: se invoca
  # con `./docker/deploy.sh migrar`, que hace `docker compose run --rm migraciones`.
  #
  # Hace falta un paso propio porque el esquema lo definen las migraciones, nunca el
  # arranque: `server.ts` comprueba que no haya pendientes y aborta si las hay. Sobre
  # una base recien creada son 19, asi que sin esto la API entra en bucle de reinicio.
  #
  # Usa la etapa `builder` y no la imagen final: `npm run migrate` es
  # `ts-node scripts/migrate.ts up`, y la final se construye con `npm ci --omit=dev`
  # (sin ts-node) y solo lleva `dist/` (sin `scripts/`). El builder tiene las dos cosas.
  migraciones:
    build:
      context: .
      dockerfile: api-backend/Dockerfile
      target: builder
    profiles: ["tools"]
    command: ["npm", "run", "migrate"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      # `scripts/migrate.ts` carga `src/config/database`, que a su vez importa la
      # configuracion general, y esa aborta el proceso si falta JWT_SECRET.
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  sitio-web:
    build:
      context: .
      dockerfile: sitio-web/Dockerfile
      args:
        BACKEND_URL: http://api-backend:4000
        # localhost, NO api-backend: esta URL la resuelve el NAVEGADOR, que corre en la
        # maquina de quien despliega y no dentro de la red de Docker, donde ese nombre
        # no existe. El puerto 4000 esta publicado justamente para esto.
        #
        # Va como ARG y no solo como variable de entorno porque Next incrusta las
        # NEXT_PUBLIC_* en el bundle del navegador al compilar: definirla despues no
        # cambia nada de lo que ya se compilo.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: sitio-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Server-side (Next dentro del contenedor): aqui si vale el nombre de servicio.
      BACKEND_URL: http://api-backend:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
      JWT_SECRET: ${JWT_SECRET}
      # El mismo valor que en api-backend: es lo que autentica POST /api/revalidar.
      REVALIDAR_SECRET: ${REVALIDAR_SECRET}
    depends_on:
      api-backend:
        condition: service_started

  intranet:
    build:
      context: .
      dockerfile: intranet/Dockerfile
      args:
        API_BACKEND_URL: http://api-backend:4000
    container_name: intranet
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      API_BACKEND_URL: http://api-backend:4000
      NEXT_PUBLIC_API_URL: http://api-backend:4000
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SITIO_WEB_URL: http://localhost:3000
    depends_on:
      api-backend:
        condition: service_started

volumes:
  pg_data:
