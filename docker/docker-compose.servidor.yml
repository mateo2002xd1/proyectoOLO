# Servidor SIN dominio propio, publicado a internet con un túnel (devtunnel).
#
# Es la pila de producción -imágenes finales, `node server.js`, NODE_ENV=production-.
# Sin SSL ni certbot: el túnel ya entrega HTTPS. Las direcciones públicas se leen
# enteras del `.env` (SITIO_WEB_URL_PUBLICA, INTRANET_URL_PUBLICA).
#
# Es el único compose del repo. Se usa siempre a través de `./docker/deploy.sh`, que
# añade `--project-directory`, el `.env` y el perfil de migraciones. Guía completa:
# docker/guia-bash.md.

name: olo-web-app

# Tope de los registros de cada contenedor (lo que muestra `docker logs`). Sin él, Docker
# guarda cada línea para siempre en un archivo que solo crece, y un servidor que lleva meses
# encendido acaba llenando el disco. Con estos valores cada servicio conserva como mucho 5
# archivos de 10 MB: al llenarse el último, descarta el más viejo. Se aplica a todos los
# servicios con `logging: *logging`.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # 18 y no 16: es la versión de la base de origen (Neon, 18.6). Con la misma versión
    # el volcado de `deploy.sh importar` entra sin traducir nada.
    image: postgres:18-alpine
    container_name: db
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Desde la 18 la imagen guarda los datos en /var/lib/postgresql/18/docker y el
      # volumen se monta en /var/lib/postgresql. Montarlo en .../data, como en la 16,
      # deja los datos fuera del volumen: se perderían al recrear el contenedor.
      # Volumen propio (pg18_data) para no chocar con el `pg_data` de la 16.
      - pg18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - olo-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *logging
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - olo-network

  api-backend:
    build:
      context: .
      dockerfile: 4000-api-backend/Dockerfile
    container_name: api
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Orígenes CORS: las direcciones por las que el NAVEGADOR llega a cada app.
      FRONTEND_URL: ${SITIO_WEB_URL_PUBLICA}
      INTRANET_URL: ${INTRANET_URL_PUBLICA}
      SITIO_WEB_URL: http://sitio-web:3000
      REVALIDAR_SECRET: ${REVALIDAR_SECRET}
      NODE_ENV: production
      # Ver `src/infrastructure/storage/filesystem.ts`. Es también el valor por
      # defecto dentro de la imagen; va explícito para que se lea junto al volumen.
      FILESYSTEM_DIR: /filesystem
      # SUB-01 (Fase 2, parcial): V8 se corta solo antes de que el proceso reserve más de
      # esto, con su propio error de memoria en vez de que el kernel mate el contenedor a
      # ciegas (SIGKILL de OOM-killer) a mitad de lo que estuviera escribiendo. Deja margen
      # bajo el tope del contenedor (de abajo) para el resto del proceso: buffers, los
      # módulos ya cargados, el propio V8 fuera del heap.
      NODE_OPTIONS: --max-old-space-size=1536
    # Segunda defensa de SUB-01, por si el tope de tamaño descomprimido de
    # `guardar-excel-de-carga.ts` no alcanzara a cortar algo (es un campo que declara el
    # propio archivo, no una medición real — ver el comentario de esa función). Sin esto,
    # hasta ahora, un proceso sin memoria de sobra podía llevarse por delante toda la
    # máquina, no solo este contenedor. El número es generoso a propósito: esto es una
    # contención de última instancia, no un ajuste fino — una carga legítima grande no
    # debe fallar por esto.
    mem_limit: 2048m
    volumes:
      # Todo lo que sube la gente: los adjuntos de las páginas del sitio y de la
      # intranet (PDF, imágenes, Excel, Word, PowerPoint, con su backup por página) y los
      # Excel de las cargas del observatorio. Solo la API lo monta: el sitio y la
      # intranet piden cada archivo por HTTP (`/api/archivos/...`) y no ven el disco
      # (3-seguridad-del-proyecto.md §S1). Estructura y comandos: docker/guia-bash.md,
      # "Los archivos subidos".
      - filesystem:/filesystem
      # Los formatos de ejemplo de "Actualizaciones" son código, no datos: vienen con el
      # repositorio y se montan de solo lectura para poder cambiarlos sin reconstruir.
      - ./4000-api-backend/uploads/formatos-carga:/app/uploads/formatos-carga:ro
    # Docker sondea `/health` de la propia API cada 30 s y `status` muestra `(healthy)` o
    # `(unhealthy)`. Es una sonda de **vida**: dice que el proceso responde, no que Postgres
    # o Redis estén bien (por qué, en el comentario de `/health` en `src/app.ts`); eso lo
    # dicen los healthcheck de `db` y `redis`. La hace Node con el `fetch` que ya trae la
    # imagen —no lleva curl ni wget— contra el 127.0.0.1 del propio contenedor, y sigue el
    # PORT que tenga. `start_period` deja arrancar a la API (conecta a la base, comprueba
    # las migraciones, levanta el worker) sin contar los fallos de ese rato.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||4000)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - olo-network

  # Aplica las migraciones y ejecuta los scripts de mantenimiento (verificar esquema,
  # sembrar permisos, crear el superadmin). No arranca con `up`: tiene perfil.
  migraciones:
    build:
      context: .
      dockerfile: 4000-api-backend/Dockerfile
      target: builder
    profiles: ["tools"]
    logging: *logging
    command: ["npm", "run", "migrate"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - olo-network

  sitio-web:
    build:
      context: .
      dockerfile: 3000-sitio-web/Dockerfile
      args:
        BACKEND_URL: http://api-backend:4000
        # Estas dos las usa el NAVEGADOR y Next las incrusta en el bundle al compilar:
        # si cambia la URL del túnel hay que reconstruir (`deploy.sh build`).
        # /api-backend es el prefijo con el que nginx reenvía a la API.
        NEXT_PUBLIC_API_URL: ${SITIO_WEB_URL_PUBLICA}/api-backend
        NEXT_PUBLIC_INTRANET_URL: ${INTRANET_URL_PUBLICA}
    container_name: sitio-web
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    environment:
      BACKEND_URL: http://api-backend:4000
      NEXT_PUBLIC_API_URL: ${SITIO_WEB_URL_PUBLICA}/api-backend
      NEXT_PUBLIC_INTRANET_URL: ${INTRANET_URL_PUBLICA}
      JWT_SECRET: ${JWT_SECRET}
      REVALIDAR_SECRET: ${REVALIDAR_SECRET}
      # API pública CNO/CUOC del buscador de ocupaciones (API_PUBLICA_CONSULTA.md).
      # Solo la leen los route handlers de /api/ocupaciones: no es NEXT_PUBLIC_ a propósito.
      CNO_API_URL: ${CNO_API_URL:-https://oloserver.tail033823.ts.net}
      CNO_API_KEY: ${CNO_API_KEY}
    # Sin volúmenes: los archivos subidos los guarda y los sirve la API. nginx le manda
    # directo /uploads/, /backup/ y /api/upload (nginx.servidor.conf).
    depends_on:
      - api-backend
    networks:
      - olo-network

  intranet:
    build:
      context: .
      dockerfile: 3001-intranet/Dockerfile
      args:
        API_BACKEND_URL: http://api-backend:4000
        NEXT_PUBLIC_SITIO_WEB_URL: ${SITIO_WEB_URL_PUBLICA}
    container_name: intranet
    restart: unless-stopped
    logging: *logging
    env_file:
      - .env
    environment:
      API_BACKEND_URL: http://api-backend:4000
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_SITIO_WEB_URL: ${SITIO_WEB_URL_PUBLICA}
    # Sin volúmenes: los adjuntos los pide a la API por su `next.config`, con la cookie
    # de sesión, que la API comprueba antes de servir nada de la intranet.
    depends_on:
      - api-backend
    networks:
      - olo-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    logging: *logging
    ports:
      # Solo en 127.0.0.1: la única entrada es el túnel, que corre en este mismo equipo.
      # Por eso nginx puede fiarse de la IP que el túnel le pasa en X-Forwarded-For
      # (ver nginx.servidor.conf): nadie más llega hasta aquí para inventársela.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./docker/nginx/nginx.servidor.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - sitio-web
      - intranet
    networks:
      - olo-network

volumes:
  # Con el nombre que ya tienen (del proyecto anterior, "olo-app"): sin `name:` Compose
  # los antepone con el nombre del proyecto, y al renombrarlo crearia volumenes nuevos y
  # vacios. La base seguiria en el viejo, pero la app arrancaria sin datos.
  pg18_data:
    name: olo-app_pg18_data
  redis_data:
    name: olo-app_redis_data
  nginx_logs:
    name: olo-app_nginx_logs
  # Externo a propósito, a diferencia de los de arriba: Compose no lo crea ni lo borra.
  # Un `docker compose down -v` se lleva los volúmenes que gestiona él, y aquí estarían
  # todos los archivos que se han subido. Lo crea `deploy.sh` la primera vez (docker
  # volume create) y solo se borra a mano.
  filesystem:
    name: olo-app_filesystem
    external: true

networks:
  olo-network:
    driver: bridge
