# nginx de `docker-compose.servidor.yml`: la "recepción" entre el túnel y las apps.
#
# Dos puertas, una por aplicación, porque el túnel da una URL por puerto:
#   8080 -> sitio-web  (y /api-backend/, /api/upload y los adjuntos -> API)
#   8081 -> intranet   (y /api-backend/ y /api/upload -> API)
# Sin SSL: el HTTPS lo pone el túnel. Archivo final, no plantilla: no hay nada que
# sustituir, las direcciones públicas viven en el `.env` y las usan las apps.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Sin versión en la cabecera `Server` ni en las páginas de error de nginx (502/504 cuando la
    # API cae): decirle a quien pregunta qué versión corre solo le ahorra trabajo.
    server_tokens     off;

    sendfile          on;
    tcp_nopush        on;
    tcp_nodelay       on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # ── IP real del visitante ────────────────────────────────────────────────
    #
    # Todo llega desde el proceso del túnel, así que sin esto nginx vería una sola IP
    # para todo el mundo: el límite de 20 peticiones/s de abajo sería para TODOS los
    # usuarios juntos, y la API contaría intentos de login de todos como uno. El túnel
    # manda la IP del visitante en X-Forwarded-For. Fiarse de esa cabecera es seguro
    # solo porque los puertos se publican en 127.0.0.1: nadie de fuera llega a nginx
    # sin pasar por el túnel.
    set_real_ip_from  0.0.0.0/0;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Dirección y esquema públicos, los que ve el navegador. Si el túnel los reescribe
    # (Host: localhost:8080), los manda en X-Forwarded-*; si no, valen los de la
    # petición. Next los necesita para armar redirecciones absolutas y para aceptar las
    # Server Actions, que comparan el Origin del navegador con este host.
    map $http_x_forwarded_host $host_publico {
        default $http_x_forwarded_host;
        ""      $http_host;
    }
    map $http_x_forwarded_proto $esquema_publico {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    limit_req_zone  $binary_remote_addr zone=api_general:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conexiones:10m;
    limit_req_status  429;
    limit_conn_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    upstream sitio_web   { server sitio-web:3000; }
    upstream intranet    { server intranet:3001; }
    upstream api_backend { server api-backend:4000; }

    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        'upgrade';
    proxy_set_header Host              $host_publico;
    proxy_set_header X-Forwarded-Host  $host_publico;
    proxy_set_header X-Forwarded-Proto $esquema_publico;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_cache_bypass $http_upgrade;

    # ── Puerta 8080: sitio web ───────────────────────────────────────────────
    server {
        listen 8080;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # /api/ queda para las rutas propias de Next (login, subidas...). La barra final
        # de proxy_pass quita el prefijo: /api-backend/api/paginas llega como /api/paginas.
        location /api-backend/ {
            limit_req  zone=api_general burst=40 nodelay;
            limit_conn conexiones 20;
            proxy_pass http://api_backend/;
        }

        # /api/revalidar es un aviso de servidor a servidor: al aprobar una página, la API
        # le pide al sitio que tire su copia en caché. La API llama directo a
        # http://sitio-web:3000 por la red de Docker, sin pasar por aquí, así que desde
        # fuera no hace falta y se corta: sin esto la protegía solo REVALIDAR_SECRET.
        # `^~` para que cubra también /api/revalidar/ y nada la adelante. Si la intranet
        # llega a tener la suya (INTRANET_REVALIDAR_URL), se corta igual en la 8081.
        location ^~ /api/revalidar {
            return 404;
        }

        # Adjuntos de las páginas. Los guarda y los sirve la API, desde su volumen
        # (/api/archivos/sitio/...); las URL públicas son las de siempre. Van directo a la
        # API y no por Next: es lo que más se pide del sitio (cada imagen de cada página)
        # y así se ahorra un salto. El next.config del sitio hace los mismos reenvíos para
        # desarrollo: si se cambia uno, se cambia el otro.
        location /uploads/ {
            proxy_pass http://api_backend/api/archivos/sitio/uploads/;
        }
        location /backup/ {
            proxy_pass http://api_backend/api/archivos/sitio/backup/;
        }
        # Nombres antiguos: /backend/ era el backup y /storage/ la carpeta física.
        location /backend/ {
            proxy_pass http://api_backend/api/archivos/sitio/backup/;
        }
        location /storage/ {
            proxy_pass http://api_backend/api/archivos/sitio/;
        }

        # La subida del editor. Directa a la API también para que el cuerpo (hasta 50 MB,
        # un PDF) no lo tenga que retener Next.
        location = /api/upload {
            limit_req  zone=api_general burst=40 nodelay;
            limit_conn conexiones 20;
            proxy_pass http://api_backend/api/archivos/sitio;
        }

        location / {
            proxy_pass http://sitio_web;
        }
    }

    # ── Puerta 8081: intranet ────────────────────────────────────────────────
    # Sin cabeceras de seguridad aquí: la intranet ya las pone (next.config.ts) y
    # repetirlas las mandaría duplicadas.
    server {
        listen 8081;

        # El cliente de la intranet pide /api-backend/paginas/... sin el /api, así que
        # aquí se añade: la misma traducción que hace el rewrite de su next.config.ts.
        location /api-backend/ {
            limit_req  zone=api_general burst=40 nodelay;
            limit_conn conexiones 20;
            proxy_pass http://api_backend/api/;
        }

        # La subida del editor va directa a la API, como en la 8080. Los adjuntos, en
        # cambio, pasan por la intranet: su middleware manda al login a quien abre un
        # enlace sin sesión (la API solo respondería 401), y aquí el tráfico es poco.
        location = /api/upload {
            limit_req  zone=api_general burst=40 nodelay;
            limit_conn conexiones 20;
            proxy_pass http://api_backend/api/archivos/intranet;
        }

        location / {
            proxy_pass http://intranet;
        }
    }
}
